# yaml-language-server: $schema=https://json-schema.org/draft-07/schema#

name: Debug

on:
  workflow_dispatch:
    inputs:
      runs-on:
        type: string
        required: true

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM and Clang
        uses: ./
        with:
          version: 23
          env: true

      - name: Show PATH
        run: echo $env:PATH

      - name: Check install directory
        run: |
          echo "LLVM_PATH=$env:LLVM_PATH"
          if (Test-Path "$env:LLVM_PATH\bin") {
            echo "bin/ exists"
            Get-ChildItem "$env:LLVM_PATH\bin" -Name | Select-Object -First 20
          } else {
            echo "bin/ does NOT exist"
            echo "Contents of install dir:"
            Get-ChildItem "$env:LLVM_PATH" -Name
          }

      - name: Test clang-cl
        run: |
          echo "CC=$env:CC"
          & "$env:LLVM_PATH\bin\clang-cl.exe" --version
